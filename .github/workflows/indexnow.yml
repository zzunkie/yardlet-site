# After GitHub Pages publishes a push to main, send the pages it changed to IndexNow (scripts/indexnow.py).
name: IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pages builds on its own after a push; send nothing until this commit, or a later one, is live.
      - name: Wait for Pages to publish this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 90); do
            built=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds" --jq '[.[] | select(.status == "built")][0].commit')
            if [ "$built" = "$GITHUB_SHA" ]; then exit 0; fi
            if [ -n "$built" ] && git fetch -q origin "$built" && git merge-base --is-ancestor "$GITHUB_SHA" "$built"; then exit 0; fi
            sleep 10
          done
          echo "Pages has not published $GITHUB_SHA in 15 minutes" >&2
          exit 1

      - name: Send the changed pages
        run: python3 scripts/indexnow.py "${{ github.event.before }}" "$GITHUB_SHA"
